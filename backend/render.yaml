# Same as repo-root render.yaml
services:
  - type: web
    name: fwang2024
    runtime: python
    plan: free
    repo: https://github.com/frankw2024/mednote
    branch: main
    autoDeployTrigger: commit
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: DB_PATH
        value: /tmp/mednote.db

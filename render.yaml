# Render Blueprint — sync from https://dashboard.render.com/blueprints
# Docs: backend/README.md
services:
  - type: web
    name: fwang2024
    runtime: python
    plan: free
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: DB_PATH
        value: /tmp/mednote.db

# Render Blueprint — https://dashboard.render.com/blueprints
# Repo: https://github.com/frankw2024/mednote
# Live API: https://fwang2024.onrender.com
services:
  - type: web
    name: fwang2024
    runtime: python
    plan: free
    repo: https://github.com/frankw2024/mednote
    branch: main
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: DB_PATH
        value: /tmp/mednote.db
